<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trust Shell</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            width: min(90vw, 640px);
            padding: 24px;
            border: 1px solid #334155;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 2rem;
        }
        p {
            line-height: 1.6;
            color: #cbd5e1;
        }
        .badge {
            display: inline-block;
            background: #1d4ed8;
            color: white;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">offline secure shell</div>
        <h1>Trust Shell</h1>
        <p>This is the local Android shell for the Trust-Shell project.</p>
        <p>It provides a minimal offline browser container that can be extended with secure document browsing, vault access, or local asset browsing.</p>
    </div>
</body>
</html>
