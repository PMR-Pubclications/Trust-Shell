name: Build All Platforms Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64 (.exe)
            os: windows-latest
            type: desktop
            working-dir: windows
            spec-file: trust_shell.spec
            artifact-name: Trust-Shell-Windows
            artifact-path: windows/dist/Trust-Shell.exe

          - name: Linux x64 (Binary)
            os: ubuntu-latest
            type: desktop
            working-dir: linux
            spec-file: trust_shell.spec
            artifact-name: Trust-Shell-Linux
            artifact-path: linux/dist/trust-shell

          - name: macOS x64/Silicon (App)
            os: macos-latest
            type: desktop
            working-dir: macos
            spec-file: trust_shell.spec
            artifact-name: Trust-Shell-macOS
            artifact-path: macos/dist/trust-shell

          - name: Android (APK)
            os: ubuntu-latest
            type: android
            artifact-name: Trust-Shell-Android-APK
            artifact-path: app/build/outputs/apk/debug/app-debug.apk

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    # --- DESKTOP BUILD STEPS ---
    - name: Set up Python
      if: matrix.platform.type == 'desktop'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies & Build Desktop Binaries
      if: matrix.platform.type == 'desktop'
      working-dir: ${{ matrix.platform.working-dir }}
      run: |
        python -m pip install --upgrade pip
        if [ -f "../requirements.txt" ]; then pip install -r ../requirements.txt; fi
        pip install pyinstaller
        pyinstaller ${{ matrix.platform.spec-file }}

    # --- ANDROID BUILD STEPS ---
    - name: Set up JDK 17
      if: matrix.platform.type == 'android'
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Grant execute permission for gradlew
      if: matrix.platform.type == 'android'
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      if: matrix.platform.type == 'android'
      run: ./gradlew assembleDebug

    # --- UPLOAD ARTIFACTS ---
    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.artifact-name }}
        path: ${{ matrix.platform.artifact-path }}
